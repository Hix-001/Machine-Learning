<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)" />
  
  <!-- Cat Face Silhouette -->
  <!-- Left Ear -->
  <polygon points="26,46 22,24 44,34" fill="url(#catGrad)" />
  <polygon points="28,42 25,28 40,35" fill="#fbcfe8" opacity="0.6" />
  
  <!-- Right Ear -->
  <polygon points="74,46 78,24 56,34" fill="url(#catGrad)" />
  <polygon points="72,42 75,28 60,35" fill="#fbcfe8" opacity="0.6" />
  
  <!-- Head Main -->
  <ellipse cx="50" cy="54" rx="28" ry="24" fill="url(#catGrad)" />
  
  <!-- Cute Eyes -->
  <ellipse cx="38" cy="50" rx="4.5" ry="6" fill="#0f172a" />
  <circle cx="39.5" cy="48" r="1.8" fill="#ffffff" />
  
  <ellipse cx="62" cy="50" rx="4.5" ry="6" fill="#0f172a" />
  <circle cx="63.5" cy="48" r="1.8" fill="#ffffff" />
  
  <!-- Cute Nose -->
  <polygon points="50,59 47,56 53,56" fill="#f43f5e" />
  
  <!-- Mouth Lines -->
  <path d="M 47,60 Q 50,63 53,60" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Whiskers -->
  <line x1="22" y1="53" x2="33" y2="54" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <line x1="20" y1="58" x2="32" y2="57" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  
  <line x1="78" y1="53" x2="67" y2="54" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <line x1="80" y1="58" x2="68" y2="57" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
</svg>
